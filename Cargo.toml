[package]
name = "demonstrator"
version = "0.1.0"
edition = "2024"

[dependencies]
qrcode = { version = "0.14.1", default-features = false }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
